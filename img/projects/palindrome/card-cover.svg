  <text x="74" y="140" fill="#5cf2ff" font-family="monospace" font-size="36" font-weight="700">LEV</text>
  <text x="164" y="140" fill="#ff4d8d" font-family="monospace" font-size="36" font-weight="700">VEL</text>
  <rect x="82" y="158" width="44" height="8" fill="#ffde59"/>
