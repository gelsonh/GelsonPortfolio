  <rect x="34" y="38" width="232" height="170" fill="#120224" stroke="#5cf2ff" stroke-width="4"/>
  <rect x="48" y="54" width="70" height="12" fill="#ffde59"/>
  <rect x="48" y="84" width="110" height="10" fill="#5cf2ff"/>
  <rect x="48" y="102" width="88" height="10" fill="#5cf2ff"/>
  <rect x="48" y="138" width="44" height="12" fill="#ff4d8d"/>
  <rect x="98" y="138" width="44" height="12" fill="#ffde59"/>
  <rect x="148" y="138" width="44" height="12" fill="#7bff00"/>
  <g transform="translate(178 86)">
