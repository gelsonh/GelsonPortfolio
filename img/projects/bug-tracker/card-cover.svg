<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
  <title id="title">Bug Tracker retro arcade cover</title>
  <desc id="desc">Neon arcade bug tracker illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120458"/>
      <stop offset="1" stop-color="#ff006e"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#5cf2ff" stroke-opacity=".16"/>
    </pattern>
  </defs>
  <rect width="300" height="300" fill="url(#bg)"/>
