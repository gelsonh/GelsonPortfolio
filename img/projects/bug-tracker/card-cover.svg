  </g>
  <text x="32" y="246" fill="#ffde59" font-family="monospace" font-size="30" font-weight="700">BUG</text>
  <text x="32" y="276" fill="#5cf2ff" font-family="monospace" font-size="30" font-weight="700">TRACKER</text>
